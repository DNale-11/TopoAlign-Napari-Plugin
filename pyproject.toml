[project]
name = "napari-cell-registration"
version = "0.1.0"
description = "TopoAlign: topology-guided cell segmentation, matching, and registration for napari"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Cell Registration Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "napari>=0.6.6,<0.7",
    "numpy>=1.22,<2.0",
    "pandas>=1.5,<2.1",
    "scikit-image>=0.20,<0.23",
    "scikit-learn>=1.2,<1.5",
    "scipy>=1.9,<1.13",
    "imageio>=2.31,<3.0",
    "tifffile>=2023.7,<2025.0",
    "opencv-python-headless>=4.8,<4.12",
    # torch is required by cellpose, but version should match user's CUDA/GPU
    # Don't constrain - let user install appropriate version for their hardware
    "numba>=0.56,<0.63",
    "llvmlite>=0.39,<0.46",
    "natsort>=8.0,<9.0",
    "tqdm>=4.65,<5.0",
    "cellpose>=4.0,<5.0",
    "matplotlib>=3.7,<3.10",
    "magicgui>=0.7.0",
    "qtpy",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"napari_cell_registration" = ["napari.yaml"]

[project.entry-points."napari.manifest"]
napari-cell-registration = "napari_cell_registration:napari.yaml"

[project.urls]
Homepage = "https://github.com/DNale-11/TopoAlign-Napari-Plugin"
Documentation = "https://github.com/DNale-11/TopoAlign-Napari-Plugin#readme"
Source = "https://github.com/DNale-11/TopoAlign-Napari-Plugin"
Issues = "https://github.com/DNale-11/TopoAlign-Napari-Plugin/issues"

[project.optional-dependencies]
gui = ["napari[pyqt5]>=0.6.6,<0.7"]
wsi = [
    "openslide-python>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-qt",
    "npe2>=0.7.9",
    "build>=1.2",
    "twine>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
