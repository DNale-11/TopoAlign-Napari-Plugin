name: Plugin checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install plugin and test dependencies
        run: python -m pip install ".[gui,dev]"
      - name: Validate manifest imports
        run: python -m npe2 validate src/napari_cell_registration/napari.yaml --imports
      - name: Run synthetic-data and GUI smoke tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
